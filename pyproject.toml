[project]
# Distribution name on PyPI. Deliberately different from the import name, which
# stays `scylla` (see `module-name` below): `scylla` is already taken on PyPI.
# This string must match the project name registered with the trusted publisher
# exactly, or uploads are rejected.
name = "scylla-rs-driver"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[build-system]
# >=1.8 because `license` is a PEP 639 SPDX expression; 1.7 expects the older
# `license = {text = ...}` table form and fails to parse this file.
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "scylla._rust"
# Without this the sdist is unbuildable. The upstream scylla/scylla-cql crates
# gate the APIs this driver calls behind `#[cfg(scylla_unstable)]`, and a cfg
# only reaches *dependencies* via RUSTFLAGS or .cargo/config.toml -- a build.rs
# `cargo::rustc-cfg` would apply to this crate alone. maturin does not pack
# .cargo/ by default, so `pip install <sdist>` failed with dozens of
# "no method named `execute_unstable`" errors.
include = [{ path = ".cargo/config.toml", format = "sdist" }]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "maturin",
    "ruff>=0.16.0",
    "basedpyright",
    "python-dateutil",
    "cryptography>=42",
    "ccm @ git+https://git@github.com/scylladb/scylla-ccm.git@master",
]


tls-integration = [
    "cryptography>=49.0.0",
    "cffi>=2.0.0",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/scylla/**/*.py"},
    { file = "python/scylla/**/*.pyi"},
]
config-settings = { build-args = '--profile=dev' }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.basedpyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
markers = [
    "requires_db: tests that require database",
    "requires_ccm: tests that require CCM cluster",
]
