name: Release

# Full-matrix build followed by an upload to PyPI or TestPyPI.
#
# Triggered manually: Actions -> Release -> Run workflow, and pick where to
# upload. Defaults to TestPyPI so a release can be rehearsed without burning a
# version number on PyPI -- both indexes are append-only, so a version, once
# uploaded, can never be reused even if the file is deleted.
#
# Pushing a `v*` tag does the same thing against the real PyPI.
#
# NOTE: workflow_dispatch only appears in the Actions UI once this file is on
# the default branch. Tag pushes work from any branch, since the workflow is
# read from the tagged commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full matrix: lib-build's defaults are both arches and all six interpreters.
  #
  # There is deliberately no tag-vs-Cargo.toml version check in front of this.
  # The realistic slip -- tagging without bumping Cargo.toml -- is caught by the
  # index itself: the wheels carry the old version, which is already published,
  # and the upload fails. Both indexes are append-only, so nothing is silently
  # overwritten either way.
  build:
    name: Build
    uses: ./.github/workflows/lib-build.yml

  # ---------------------------------------------------------------------------
  # Publish via PyPI Trusted Publishing (OIDC) -- no API token stored in the repo.
  #
  # This job is HERE rather than inside lib-build.yml on purpose. The OIDC token
  # identifies the workflow file in which the job is defined, so a publish step
  # inside the reusable workflow would present `lib-build.yml` to the index while
  # the trusted publisher names `release.yml`, and every upload would fail with
  # `invalid-publisher`.
  # See: https://github.com/pypa/gh-action-pypi-publish/issues/166
  #
  # Two publishers are required, one per index, because they are separate sites
  # with separate accounts:
  #   pypi.org      -> workflow `release.yml`, environment `pypi`
  #   test.pypi.org -> workflow `release.yml`, environment `testpypi`
  # The environment name is part of the OIDC claim, so it must match on both
  # sides exactly.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi') && 'PyPI' || 'TestPyPI' }}
    needs: [build]
    # No `if:` -- both triggers are meant to publish, so there is nothing to
    # gate on. The pypi/testpypi choice is made by the three expressions below,
    # which all test `== 'pypi'`; anything else, including an empty or
    # unresolved input, falls through to TestPyPI rather than production.
    runs-on: ubuntu-24.04
    environment:
      # A tag push always means the real thing; a manual run means TestPyPI
      # unless it explicitly asked for pypi. This tests the ref rather than
      # `event_name == 'push'` so that it keeps holding if a `branches:` filter
      # is ever added to the push trigger above.
      name: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Artifacts are per-run, so the ones lib-build.yml uploaded are visible here.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List what will be uploaded
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # Tolerate re-uploads on TestPyPI so a rehearsal can be re-run after a
          # partial failure. Never on PyPI, where it would silently mask an
          # attempt to republish a version that already exists.
          skip-existing: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi') }}
          # Sigstore attestations for the uploaded files.
          attestations: true
