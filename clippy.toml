# Blocking on a lock while attached to the interpreter can deadlock: the holder
# may have lost the GIL inside Python and needs it back to release the lock.
# Attached code waits through pyo3's `*_py_attached` methods. A plain call is
# only fine on a detached thread, inside `py.detach`, or when every holder of
# that lock releases it without needing the GIL (pure Rust under the lock: no
# Python call, no Python allocation, no `Py` drop). Each such call carries an
# `#[expect]` saying which.
disallowed-methods = [
  { path = "std::sync::Mutex::lock", reason = "use lock_py_attached, or #[expect] saying why this thread is detached or why holders release the lock without needing the GIL" },
  { path = "std::sync::RwLock::read", reason = "use read_py_attached, or #[expect] saying why this thread is detached or why holders release the lock without needing the GIL" },
  { path = "std::sync::RwLock::write", reason = "use write_py_attached, or #[expect] saying why this thread is detached or why holders release the lock without needing the GIL" },
  { path = "std::sync::Condvar::wait", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "std::sync::Condvar::wait_while", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "std::sync::Condvar::wait_timeout", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "std::sync::OnceLock::get_or_init", reason = "use get_or_init_py_attached" },
  { path = "std::sync::OnceLock::get_or_try_init", reason = "use get_or_try_init_py_attached" },
  { path = "std::sync::OnceLock::set", reason = "use PyOnceLock, or call inside py.detach and #[expect] this lint" },
  { path = "std::sync::OnceLock::wait", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "std::sync::Once::call_once", reason = "use call_once_py_attached" },
  { path = "std::sync::Once::call_once_force", reason = "use call_once_force_py_attached" },
  { path = "std::sync::Once::wait", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "std::sync::Once::wait_force", reason = "wait inside py.detach and #[expect] this lint" },
  { path = "tokio::sync::Mutex::blocking_lock", reason = "never block a Python thread on a tokio lock" },
]
